name: Build CivilCAD Android APK
on:
  push:
    branches: [android-cad-viewer]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Build native DWG engine
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cd native
          cargo build --release --target aarch64-linux-android
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcivilcad_native.so ../app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CivilCAD-Mobile-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
